<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap">
<style>
html,body{margin:0;width:1500px;height:500px;background:#0c0c0c;color:#f4f4f2;font-family:Satoshi,system-ui,sans-serif;overflow:hidden}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:18px}
.note{display:inline-flex;align-items:center;gap:12px;padding:5px 18px 5px 5px;border:1px solid #2a2a2a;border-radius:999px;background:#161616;color:#b9b9b4;font-size:19px;margin-bottom:30px}
.note b{padding:4px 12px;border-radius:999px;background:#f4f4f2;color:#0c0c0c;font-size:15px}
h1{margin:0;font-size:84px;font-weight:700;letter-spacing:-0.045em;line-height:1.04;text-align:center}
.mark{display:inline-block;padding:0 .2em .04em;border-radius:.2em;background:#f4f4f2;color:#0c0c0c;transform:rotate(-1.5deg)}
.foot{position:absolute;right:56px;bottom:40px;display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;letter-spacing:-0.02em}
.url{position:absolute;right:56px;top:40px;font-size:17px;color:#86867f;font-weight:500}
</style></head><body>
<div class="url">breaker-one.vercel.app</div>
<div class="wrap">
  <div class="note"><b>New</b>The SEC let real US stocks trade on chain from 17 September</div>
  <h1>Stock tokens don't know<br>when trading <span class="mark">halts</span></h1>
</div>
<div class="foot">
  <svg width="30" height="30" viewBox="0 0 20 20" fill="none"><circle cx="3.5" cy="10" r="2.2" fill="#f4f4f2"/><circle cx="16.5" cy="10" r="2.2" fill="#f4f4f2"/><path d="M3.5 10 L12.5 3.5" stroke="#f4f4f2" stroke-width="2.2" stroke-linecap="round"/></svg>
  Breaker
</div>
</body></html>
